{% extends 'base.html' %}
{% load static %}

{% block title %}
    Dashboard
{% endblock %}

{% block content %}
    <main class="fraction-background">
        <h1>Działania na ułamkach</h1>
    </main>

    <div class="section">
        {% for level in levels %}
            <a href="{% url 'level-detail' level.url_path %}" class="card">
                <h5 class="card-title">{{ level.level_name }}</h5>
                <img
                    class="card-img-top"
                    src="{% static 'images/cards/lvl' %}{{ level.id }}.png"
                    alt="{{ level.level_name }}"
                >
            </a>
        {% empty %}
            <p>Brak dostępnych leveli.</p>
        {% endfor %}
    </div>
{% endblock %}
